apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: poc
spec:
  type: NodePort
  ports:
    - port: 9080
      targetPort: 9080
      nodePort: 30000
      protocol: TCP
      name: http
    - port: 9443
      targetPort: 9443
      nodePort: 30001
      protocol: TCP
      name: https
  selector:
    app: keycloak